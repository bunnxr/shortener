name = "shortener"            # must match your existing Worker's name
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false           # keep the workers.dev URL off so Access can't be bypassed

routes = [{ pattern = "bunnxr.com/*", zone_name = "bunnxr.com" }]

[assets]
directory = "./public"        # serves /links/ (HTML, CSS, JS)

[observability.logs]
enabled = true
invocation_logs = true

[[kv_namespaces]]
binding = "LINKS"
id = "d714e0bc1f154df5b8a8faa753193f85"

# Optional hardening: verify the Cloudflare Access JWT inside the Worker.
# Team domain looks like "yourteam.cloudflareaccess.com"; AUD is the Access app's Application Audience tag.
[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
