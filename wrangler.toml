name = "shortener"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false

routes = [
  { pattern = "bunnxr.com/*", zone_name = "bunnxr.com" },
  { pattern = "links.bunnxr.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "LINKS"
id = "YOUR_KV_NAMESPACE_ID"

[vars]
ADMIN_HOST = "links.bunnxr.com"
SHORT_HOST = "bunnxr.com"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""