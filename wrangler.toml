name = "shortener"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false

routes = [
  { pattern = "bunnxr.com/*", zone_name = "bunnxr.com" },
  { pattern = "links.bunnxr.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true

[[kv_namespaces]]
binding = "LINKS"
id = "d714e0bc1f154df5b8a8faa753193f85"

# Names that are not short links here are handed to the r2-files Worker (file links like bunnxr.com/gta6.mp4)
[[services]]
binding = "FILES"
service = "r2-files"

[vars]
ADMIN_HOST = "links.bunnxr.com"
SHORT_HOST = "bunnxr.com"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""