<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Links by bunnxr</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <a class="logo" href="/" aria-label="bunnxr links">
    <svg viewBox="0 0 40 40" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
      <path class="d" pathLength="1" d="M15 24C9 14 11 3 16 4C20 5 19 15 19 24"/>
      <path class="d ear" pathLength="1" d="M25 24C31 14 29 3 24 4C20 5 21 15 21 24"/>
      <rect class="d" pathLength="1" x="9" y="24" width="22" height="11" rx="5.5"/>
    </svg>
    <span class="word">bunnxr<b>_</b></span>
  </a>
</header>
<section class="sheet">
  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="link">short link</button>
    <button class="tab" data-tab="qr">qr code</button>
  </div>
  <h1 id="title">Shorten a long link</h1>
  <div class="bar">
    <input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Place your long link here" autofocus>
    <button id="go">Shorten URL</button>
  </div>
  <details id="opts" open>
    <summary>Name and customize</summary>
    <div class="grid">
      <label>Link name<input id="name" maxlength="80" placeholder="Game pack"></label>
      <label>Slug<span class="pre"><i id="host"></i><input id="slug" placeholder="xyz"></span></label>
    </div>
  </details>
  <div id="msg" role="status"></div>
</section>
<main>
  <div class="head"><h2>Your links <small id="count"></small></h2><input id="q" type="search" placeholder="Search links"></div>
  <div id="list"></div>
</main>
<dialog id="qrd">
  <div id="qrbox"></div>
  <p id="qrlabel"></p>
  <div class="acts"><button id="qrdl">Download PNG</button><button id="qrx" class="ghost">Close</button></div>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
