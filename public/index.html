<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Links by bunnxr</title>
<script>(function(d){d.theme="dark";d.icons="on";try{d.theme=localStorage.getItem("theme")||"dark";d.icons=localStorage.getItem("icons")||"on"}catch(e){}})(document.documentElement.dataset)</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='2.5%202%2035%2035'%20fill='none'%20stroke='%230f766e'%20stroke-width='3.4'%20stroke-linecap='round'%3E%3Cstyle%3E@media%20(prefers-color-scheme:dark)%7Bsvg%7Bstroke:%234fd1bf%7D%7D.e%7Btransform-box:fill-box;transform-origin:50%25%20100%25;animation:t%207s%202.5s%20infinite%7D@keyframes%20t%7B0%25,90%25,100%25%7Btransform:rotate(0)%7D93%25%7Btransform:rotate(11deg)%7D96%25%7Btransform:rotate(-4deg)%7D%7D%3C/style%3E%3Cpath%20d='M15%2024C9%2014%2011%203%2016%204C20%205%2019%2015%2019%2024'/%3E%3Cpath%20class='e'%20d='M25%2024C31%2014%2029%203%2024%204C20%205%2021%2015%2021%2024'/%3E%3Crect%20x='9'%20y='24'%20width='22'%20height='11'%20rx='5.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <button class="logo" id="logo" type="button" aria-controls="sheet" aria-expanded="false" title="Show the link shortener">
    <svg viewBox="0 0 40 40" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
      <path class="d" pathLength="1" d="M15 24C9 14 11 3 16 4C20 5 19 15 19 24"/>
      <path class="d ear" pathLength="1" d="M25 24C31 14 29 3 24 4C20 5 21 15 21 24"/>
      <rect class="d" pathLength="1" x="9" y="24" width="22" height="11" rx="5.5"/>
    </svg>
    <span class="word">bunnxr</span>
  </button>
  <div class="set">
    <button class="ib" id="setBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="setMenu" title="Settings" aria-label="Settings"><svg class="i keep" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <div class="setmenu" id="setMenu" hidden>
      <p class="setlbl">Theme</p>
      <div class="seg" role="group" aria-label="Theme"><button type="button" data-set="theme" data-val="dark">Dark</button><button type="button" data-set="theme" data-val="light">Light</button></div>
      <p class="setlbl">Icons</p>
      <div class="seg" role="group" aria-label="Icons"><button type="button" data-set="icons" data-val="on">Show</button><button type="button" data-set="icons" data-val="off">Hide</button></div>
    </div>
  </div>
</header>
<div class="app solo" id="app">
  <section class="sheet" id="sheet" hidden>
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="link">short link</button>
      <button class="tab" data-tab="qr">qr code</button>
    </div>
    <h1 id="title">Shorten a long link</h1>
    <div class="bar">
      <input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Place your long link here">
      <button id="go">Shorten URL</button>
    </div>
    <details id="opts" open>
      <summary>Name and customize</summary>
      <div class="grid">
        <label>Link name<input id="name" maxlength="80" placeholder="Game pack"></label>
        <label>Slug<span class="pre"><i id="host"></i><input id="slug" placeholder="xyz"></span></label>
        <label>Folder<select id="folder"><option value="">Home (no folder)</option></select></label>
      </div>
    </details>
    <div id="msg" role="status"></div>
  </section>
  <section class="fm">
    <div class="fmbar">
      <nav class="crumbs" id="crumbs"></nav>
      <label class="search"><svg class="i" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search all links" aria-label="Search all links"></label>
    </div>
    <div id="fmsg" role="status"></div>
    <form id="nf"><input id="nfn" maxlength="40" placeholder="New folder name" autocomplete="off"><button><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/></svg>Create folder</button></form>
    <div id="folders" class="folders"></div>
    <div id="list"></div>
  </section>
</div>
<dialog id="qrd">
  <div id="qrbox"></div>
  <p id="qrlabel"></p>
  <div class="acts"><button id="qrdl">Download PNG</button><button id="qrx" class="ghost">Close</button></div>
</dialog>
<dialog id="r2d" class="r2d">
  <h2>New file link</h2>
  <div id="r2pick">
    <div id="r2drives" class="seg r2seg" role="group" aria-label="Drive" hidden></div>
    <nav class="crumbs" id="r2crumbs"></nav>
    <div id="r2files" class="r2files"></div>
  </div>
  <div id="r2form" hidden>
    <p class="r2chosen"><span>File</span><b id="r2file"></b><button id="r2change" class="ghost small" type="button">Change</button></p>
    <div class="grid">
      <label>Address<span class="pre"><i id="r2host"></i><input id="r2name" placeholder="leave empty to use the file name" autocomplete="off" spellcheck="false"></span></label>
      <label id="r2typel">Link type<select id="r2type"><option value="view">Open in the browser</option><option value="download">Download</option></select></label>
      <label>Works for<select id="r2valid"><option value="3600">1 hour</option><option value="86400">1 day</option><option value="604800" selected>7 days</option><option value="2592000">30 days</option><option value="7776000">90 days</option><option value="0">Never expires</option></select></label>
    </div>
    <p id="r2msg" class="r2msg"></p>
  </div>
  <div class="acts"><button id="r2create" type="button" hidden>Create link</button><button id="r2x" class="ghost" type="button">Close</button></div>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
